# qFoundry mode: windows-codex-compat
#
# Compatibility profile for Codex clients or Windows hosts where granular
# permission profiles are unavailable or blocked by the local sandbox backend.
#
# Launch the worker with --cd pointing at the assigned worktree and do not pass
# --add-dir for unrelated repositories or credential locations.
# This mode is suitable for controlled personal development, but it has weaker
# filesystem granularity than codex-worker.permissions.config.toml.

sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[sandbox_workspace_write]
network_access = false
writable_roots = []

[apps._default]
open_world_enabled = false
destructive_enabled = false
approvals_reviewer = "auto_review"

[shell_environment_policy]
inherit = "core"
exclude = ["*KEY*", "*SECRET*", "*TOKEN*", "*PASSWORD*", "GITHUB_*", "AWS_*", "AZURE_*"]
